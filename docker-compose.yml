services:
  rag-mcp:
    build:
      context: .
    image: modular-rag-mcp:local
    command:
      - python
      - scripts/start_mcp_server.py
      - --transport
      - streamable-http
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    expose:
      - "8000"
    ports:
      - "127.0.0.1:8010:8000"
    volumes:
      - ./config/settings.yaml:/app/config/settings.yaml:ro
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped

  dashboard:
    build:
      context: .
    image: modular-rag-mcp:local
    command:
      - python
      - scripts/start_dashboard.py
      - --server.address=0.0.0.0
      - --server.port=8501
    ports:
      - "8501:8501"
    volumes:
      - ./config/settings.yaml:/app/config/settings.yaml:ro
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
